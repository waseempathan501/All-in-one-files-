            padding-bottom: 5px;

            color: #aaaaaa;

            background: #000;
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
            border-radius: 8px;
            margin-top: 25px;
            display: none;
            padding: 15px;

        .terminal-header {

            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #ffff00;

        #log-screen {

            overflow-y: auto;
            overflow-x: hidden;
            font-size: 11px;
            line-height: 1.5;
            border-top: 1px solid #222;
            padding-top: 10px;

        .log-line {
