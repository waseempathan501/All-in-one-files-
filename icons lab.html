<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Icons Lab — Powered by Waseem</title>
<style>
  :root{
    --bg:#05070f;
    --accent1:#4f7bff;
    --accent2:#8b6bff;
    --card-radius:1.1rem;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:#fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  canvas#net{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index:0;
    pointer-events:none;
  }
  .wrap{
    position:relative;
    z-index:1;
    max-width:900px;
    margin:0 auto;
    padding:22px 20px 70px;
  }

  /* ---------- Header ---------- */
  .top-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:34px;
  }
  .pill-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:11px 18px;
    border-radius:999px;
    font-size:.8rem;
    font-weight:700;
    letter-spacing:.03em;
    text-decoration:none;
    border:1px solid rgba(79,123,255,.35);
    background:rgba(79,123,255,.08);
    color:#6fa0ff;
    transition:.2s;
  }
  .pill-btn.owner{
    border:1px solid rgba(139,107,255,.4);
    background:rgba(139,107,255,.08);
    color:#b79bff;
  }
  .pill-btn:active{ transform:scale(.96); }
  .pill-btn svg{width:16px;height:16px;flex:none;}

  .hero{ text-align:center; margin-bottom:30px; }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 16px;
    border-radius:999px;
    border:1px solid rgba(79,123,255,.4);
    background:rgba(79,123,255,.07);
    color:#7aa5ff;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.15em;
    margin-bottom:22px;
  }
  .badge .dot{
    width:6px;height:6px;border-radius:50%;
    background:#6fa0ff;
    box-shadow:0 0 8px #6fa0ff;
  }
  h1.title{
    font-size:2.6rem;
    line-height:1.08;
    margin:0 0 22px;
    font-weight:900;
    letter-spacing:-.01em;
    background:linear-gradient(90deg,#5a8bff,#9b7dff 55%,#b98bff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub1{
    font-size:.82rem;
    letter-spacing:.28em;
    color:#9aa3b5;
    font-weight:700;
    margin-bottom:14px;
  }
  .sub1-line{
    width:70px;height:2px;margin:0 auto 14px;
    background:linear-gradient(90deg,transparent,#6fa0ff,transparent);
  }
  .sub2{
    font-size:.68rem;
    letter-spacing:.14em;
    color:#5c6577;
    font-weight:600;
  }

  /* ---------- Search ---------- */
  .search-box{
    margin:30px 0 18px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:16px 20px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.03);
    color:#fff;
    font-size:.95rem;
    outline:none;
  }
  .search-box input::placeholder{color:#6b7280;}
  .search-box input:focus{border-color:rgba(111,160,255,.6);}

  /* ---------- Theme tabs ---------- */
  .tabs-wrap{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:6px 2px 20px;
    scrollbar-width:none;
  }
  .tabs-wrap::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:none;
    padding:11px 20px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.03);
    color:#8b93a7;
    font-size:.85rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:.15s;
  }
  .tab-btn.active{
    border-color:rgba(111,160,255,.7);
    background:rgba(79,123,255,.12);
    color:#7fabff;
    box-shadow:0 0 14px rgba(79,123,255,.35);
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-top:10px;
  }
  @media(min-width:480px){ .grid{grid-template-columns:repeat(6,1fr);} }
  @media(min-width:720px){ .grid{grid-template-columns:repeat(8,1fr);} }

  .divider{
    grid-column:1/-1;
    height:1px;
    background:linear-gradient(90deg,rgba(255,255,255,.18),transparent);
    margin:6px 0;
  }

  .icon-tile{
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    cursor:pointer;
    position:relative;
    background:var(--brand);
    color:#fff;
    border-radius:18px;
    transition:transform .15s ease;
    -webkit-user-select:none; user-select:none;
  }
  .icon-tile:active{ transform:scale(.9); }
  .icon-tile svg{ width:36%; height:36%; }
  .icon-tile .glyph{ font-size:.85rem; font-weight:800; letter-spacing:-.02em; }
  .icon-tile .glyph.sm{ font-size:.5rem; letter-spacing:0; }

  .icon-label{
    display:none;
  }
  .no-results{
    grid-column:1/-1;
    text-align:center;
    color:#6b7280;
    padding:40px 0;
    font-size:.9rem;
  }

  /* ===== THEME VARIANTS ===== */
  /* Normal = default tile styles above (brand color fill) */

  [data-theme="black"] .icon-tile,
  [data-theme="midnight"] .icon-tile{
    background:#000;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 0 15px rgba(255,255,255,.15);
    color:#fff;
  }
  [data-theme="midnight"] .icon-tile{ box-shadow:0 0 8px rgba(255,255,255,.08); border-color:rgba(255,255,255,.08); }

  [data-theme="gold"] .icon-tile{
    background:#000;
    border:1px solid #d4af37;
    box-shadow:0 0 15px rgba(212,175,55,.4);
    color:#e8c766;
  }

  [data-theme="purple"] .icon-tile{
    background:#000;
    border:1px solid #9b6bff;
    box-shadow:0 0 15px rgba(155,107,255,.4);
    color:#b79bff;
  }

  [data-theme="pure-gold"] .icon-tile{
    background:#000;
    border-radius:50%;
    border:2px solid #ffd447;
    outline:2px solid rgba(255,212,71,.35);
    outline-offset:3px;
    box-shadow:0 0 20px rgba(255,212,71,.55);
    color:#ffd447;
  }

  [data-theme="glossy"] .icon-tile{
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 45%), var(--brand);
    box-shadow:inset 0 -4px 8px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.5);
    color:#fff;
  }

  [data-theme="3d"] .icon-tile{
    border-radius:16px;
    background:var(--brand);
    box-shadow:0 6px 0 rgba(0,0,0,.35), 0 10px 16px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.25);
    color:#fff;
  }
  [data-theme="3d"] .icon-tile:active{ box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.25); transform:translateY(4px) scale(.97); }

  [data-theme="bezel"] .icon-tile{
    background:#12151f;
    border-radius:18px;
    box-shadow:6px 6px 12px rgba(0,0,0,.5), -4px -4px 10px rgba(255,255,255,.03), inset 0 0 0 1px rgba(255,255,255,.04);
    color:var(--brand);
  }
  [data-theme="bezel"] .icon-tile svg, [data-theme="bezel"] .icon-tile .glyph{ filter:drop-shadow(0 0 4px var(--brand)); }

  [data-theme="neon"] .icon-tile{
    background:transparent;
    border:2px solid var(--brand);
    box-shadow:0 0 12px var(--brand), inset 0 0 10px rgba(255,255,255,.05);
    color:var(--brand);
  }

  [data-theme="rgb"] .icon-tile{
    background:#000;
    position:relative;
    z-index:0;
    color:#fff;
  }
  [data-theme="rgb"] .icon-tile::before{
    content:"";
    position:absolute; inset:-2px;
    border-radius:20px;
    background:conic-gradient(from 0deg, #ff3d5a, #ffcb3d, #4dff8f, #3dc4ff, #b23dff, #ff3d5a);
    z-index:-1;
    animation:spin 3s linear infinite;
  }
  [data-theme="rgb"] .icon-tile::after{
    content:"";
    position:absolute; inset:2px;
    border-radius:16px;
    background:#000;
    z-index:-1;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  [data-theme="glass"] .icon-tile{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(6px);
    box-shadow:0 0 18px color-mix(in srgb, var(--brand) 45%, transparent);
    color:var(--brand);
  }

  [data-theme="neumorphic"] .icon-tile{
    background:#161a24;
    border-radius:20px;
    box-shadow:8px 8px 16px #0a0c12, -8px -8px 16px #22283a;
    color:#8b93a7;
  }

  [data-theme="radiant"] .icon-tile{
    background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--brand) 55%, transparent), transparent 70%), rgba(255,255,255,.04);
    border:1px solid color-mix(in srgb, var(--brand) 60%, transparent);
    box-shadow:0 0 24px color-mix(in srgb, var(--brand) 55%, transparent);
    color:#fff;
  }

  [data-theme="jelly"] .icon-tile{
    border-radius:42% 58% 61% 39% / 45% 41% 59% 55%;
    background:linear-gradient(145deg, color-mix(in srgb, var(--brand) 80%, white 10%), var(--brand));
    box-shadow:inset 0 4px 10px rgba(255,255,255,.35), 0 6px 14px rgba(0,0,0,.4);
    color:#fff;

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(3px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;

  .overlay.open{ display:flex; }
  @media(min-width:600px){ .overlay{ align-items:center; } }

  .modal{
    background:#0c0f18;
    border:1px solid rgba(255,255,255,.1);
    border-radius:22px 22px 0 0;
    width:100%;
    max-width:560px;
    max-height:85vh;
    overflow-y:auto;
    padding:24px;
    animation:up .2s ease;
  }
  @media(min-width:600px){ .modal{ border-radius:20px; } }
  @keyframes up{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }

  .modal-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:18px; }
  .modal-head .tile-preview{ width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; flex:none; background:var(--brand); }
  .modal-head .tile-preview svg{ width:50%; height:50%; }
  .modal-head h3{ margin:0 0 4px; font-size:1.15rem; }
  .modal-head p{ margin:0; color:#8b93a7; font-size:.82rem; }
  .modal-close{ margin-left:auto; background:none; border:none; color:#8b93a7; font-size:1.4rem; cursor:pointer; line-height:1; padding:4px; }

  .code-box{
    background:#05070d;
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    padding:16px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.76rem;
    line-height:1.55;
    color:#c8d0e0;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:260px;
    overflow-y:auto;
    margin-bottom:16px;
  }
  .code-box .kw{color:#7aa5ff;}
  .code-box .str{color:#9be38a;}
  .code-box .tag{color:#e8a3e8;}

  .copy-btn{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid rgba(111,160,255,.4);
    background:rgba(79,123,255,.1);
    color:#7fabff;
    font-weight:700;
    font-size:.9rem;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
  }
  .copy-btn:active{ transform:scale(.98); }
  .copy-btn svg{ width:16px; height:16px; }

  .toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#182034;
    border:1px solid rgba(111,160,255,.4);
    color:#fff;
    padding:12px 20px;
    border-radius:12px;
    font-size:.85rem;
    z-index:99;
    opacity:0;
    transition:.25s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer{
    text-align:center;
    margin-top:50px;
    color:#4a5164;
    font-size:.72rem;
    letter-spacing:.05em;
  }
</style>

<script>
/* ================= PARTICLE NETWORK BACKGROUND ================= */
(function(){
  const canvas = document.getElementById('net');
  const ctx = canvas.getContext('2d');
  let w,h,pts;
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function init(){
    resize();
    const count = Math.floor((w*h)/22000);
    pts = Array.from({length:count}, ()=>({
      x:Math.random()*w, y:Math.random()*h,
      vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25
    }));
  }
  function step(){
    ctx.clearRect(0,0,w,h);
    for(const p of pts){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>w) p.vx*=-1;
      if(p.y<0||p.y>h) p.vy*=-1;
    }
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const a=pts[i], b=pts[j];
        const dx=a.x-b.x, dy=a.y-b.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<130){
          ctx.strokeStyle = 'rgba(90,130,255,'+(0.16*(1-d/130))+')';
          ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    for(const p of pts){
      ctx.beginPath();
      ctx.arc(p.x,p.y,1.6,0,Math.PI*2);
      ctx.fillStyle='rgba(110,150,255,.85)';
      ctx.fill();
    }
    requestAnimationFrame(step);
  }
  window.addEventListener('resize', init);
  init(); step();
})();

let activeTheme = 'normal';

/* ================= RENDER ================= */
const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');

THEMES.forEach(t=>{
  const b = document.createElement('button');
  b.className = 'tab-btn' + (t.id==='normal' ? ' active' : '');
  b.textContent = t.label;
  b.dataset.theme = t.id;
  b.addEventListener('click', ()=>{
    activeTheme = t.id;
    document.body.setAttribute('data-theme', t.id);
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
  tabsEl.appendChild(b);
});

function renderGrid(filter){
  gridEl.innerHTML = '';
  const q = (filter||'').trim().toLowerCase();
  let shown = 0;
  ICONS.forEach(icon=>{
    if(icon.divider){
      if(!q){ const d=document.createElement('div'); d.className='divider'; gridEl.appendChild(d); }
      return;
    }
    if(q && !icon.name.toLowerCase().includes(q)) return;
    shown++;
    const btn = document.createElement('button');
    btn.className = 'icon-tile';
    btn.style.setProperty('--brand', icon.bg);
    if(icon.fg) btn.style.color = icon.fg;
    btn.innerHTML = icon.html;
    btn.addEventListener('click', ()=> openModal(icon));
    gridEl.appendChild(btn);
  });
  if(shown===0){
    const p = document.createElement('div');
    p.className='no-results';
    p.textContent = 'No icons found.';
    gridEl.appendChild(p);
  }
}
renderGrid('');

document.getElementById('search').addEventListener('input', e=>{
  renderGrid(e.target.value);
});

/* ================= MODAL / CODE GEN ================= */
const overlay = document.getElementById('overlay');
const mPreview = document.getElementById('mPreview');
const mTitle = document.getElementById('mTitle');
const mCode = document.getElementById('mCode');
const toast = document.getElementById('toast');
let currentCode = '';

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlight(code){
  return escapeHtml(code)
    .replace(/(import|from)/g, '<span class="kw">$1</span>')
    .replace(/('[^']*')/g, '<span class="str">$1</span>')
    .replace(/(&lt;\/?[A-Za-z0-9.]+)/g, '<span class="tag">$1</span>');
}

function classesFor(themeId, icon){
  const t = THEMES.find(x=>x.id===themeId);
  let cls = t.cls.replaceAll('var(--brand)', icon.bg).replaceAll('[var(--brand)]', "["+icon.bg+"]");
  return cls;
}

function generateCode(icon, themeId){
  const cls = classesFor(themeId, icon);
  return "import { " + icon.react.comp + " } from 'react-icons/" + icon.react.pkg + "';\n\n" +
"<a\n" +
'  href="#"\n' +
'  className="' + cls + '"\n' +
">\n" +
"  <" + icon.react.comp + "\n" +
'    className="w-6 h-6 sm:w-7 sm:h-7"\n' +
"  />\n" +
"</a>";
}

function openModal(icon){
  mPreview.style.setProperty('--brand', icon.bg);
  mPreview.style.background = icon.bg;
  if(icon.fg) mPreview.style.color = icon.fg; else mPreview.style.color='#fff';
  mPreview.innerHTML = icon.html;
  mTitle.textContent = icon.name + ' Icon';
  currentCode = generateCode(icon, activeTheme);
  mCode.innerHTML = highlight(currentCode);
  overlay.classList.add('open');
}
document.getElementById('mClose').addEventListener('click', ()=> overlay.classList.remove('open'));
overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('open'); });

document.getElementById('mCopy').addEventListener('click', ()=>{
  navigator.clipboard.writeText(currentCode).then(()=>{
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1600);
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = currentCode; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1600);
  });
});
</script>
